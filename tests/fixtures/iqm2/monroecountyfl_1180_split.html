    <script type="text/javascript">
        $(function () {
            $("#OutlinePanelInner").each(function () { FrameInsert($(this), InitializeOutline); });
            $("#RightContent").each(function () {
                FrameInsert($(this), function () { moRightPanelScroller = EnableRightPanelScrolling(); firstRun = false; });
            });
            $("body").css("overflow", "auto");

            $(window).resize(function () {
                FixProportions();
                EnableLeftPanelScrolling();
                EnableRightPanelScrolling();
            });

            //when showing video, hide the "Normal View" button, as the video shows in a new window
            if ($("#VideoPanelInner").length > 0) {
                $("#btnNormalView").css("display", "none");
            }

            $("#Splitter").mousedown(BeginResize);
            $("#VSplitter").mousedown(BeginVResize);

            StickyNotesFixHeight($("#SplitViewLayout #LeftTopPanel").height());

            miLeftPercent = $("#SplitViewLayout #LeftPanel").width() / $(window).width();

            // size top left for sticky notes, hd or sd video
            miTopPercent = 0.20;
            $("#VideoPanelInner").each(function () {
                if ($(this).attr("quality") == "hd")
                    miTopPercent = 0.345;
                else
                    miTopPercent = 0.45;
            });


        });
        var lastUrl, firstRun = true;
        var miLeftPercent;
        var miTopPercent;

        var miDragBeginX;
        var miDragBeginY;
        var miDragBeginSize;

        function FixProportions() {
            RememberPlayerPosition();
            if (miLeftPercent == 0 || miTopPercent == 0)
                return;
            ChangeVideoPannelVisibility(false);

            var iLeftWidth = $(window).width() * miLeftPercent;
            $("#SplitViewLayout #LeftPanel").width(iLeftWidth);

            var iTopHeight = $(window).height() * miTopPercent;
            $("#SplitViewLayout #LeftTopPanel").height(iTopHeight);

            StickyNotesFixHeight(iTopHeight);
            FixVideoSize(0, 0);

            RestorePlayerPosition();
        }

        function BeginResize(e) {
            RememberPlayerPosition();
            miDragBeginX = e.pageX;
            miDragBeginSize = $("#SplitViewLayout #LeftPanel").width();

            $("*").bind("mousedown", NullFunction);
            $("#SplitViewLayout").bind("mousemove", DragResize);
            $("#SplitViewLayout").bind("mouseup", EndResize);
        }

        function NullFunction() { return false; } //used to prevent selection while resizing

        function EndResize(e) {
            miDragBeginX = 0;
            $("#SplitViewLayout").unbind('mousemove', DragResize);
            $("#SplitViewLayout").unbind('mouseup', EndResize);
            $("*").unbind("mousedown", NullFunction);

            FixVideoSize(0, 0);
            SetVideoVisibleForResize(true);

            EnableLeftPanelScrolling();
            EnableRightPanelScrolling();
        }

        function DragResize(e)
        {
            if (miDragBeginX == 0)
                return;

            var iDeltaX = e.pageX - miDragBeginX;

            var iNewSize = miDragBeginSize + iDeltaX;

            if (iNewSize < 100)
                iNewSize = 100;

            // video will block the panel from resizing, so hide it during the resize
            // first, "freeze" the height of the video panel, otherwise hiding the video will make the panel collapse
            $("#LeftTopPanel").height($("#LeftTopPanel").height());
            SetVideoVisibleForResize(false);

            $("#SplitViewLayout #LeftPanel").width(iNewSize);
            miLeftPercent = iNewSize / $(window).width();
        }

        function BeginVResize(e) {
            RememberPlayerPosition();
            miDragBeginY = e.pageY;
            miDragBeginSize = $("#SplitViewLayout #LeftTopPanel").height();

            $("*").bind("mousedown", NullFunction);
            $("#SplitViewLayout").bind('mousemove', DragVResize);
            $("#SplitViewLayout").bind('mouseup', EndVResize);
        }

        function EndVResize(e) {
            miDragBeginY = 0;
            $("#SplitViewLayout").unbind('mousemove', DragVResize);
            $("#SplitViewLayout").unbind('mouseup', EndVResize);
            $("*").unbind("mousedown", NullFunction);

            FixVideoSize(0, 0);
            SetVideoVisibleForResize(true);

            EnableLeftPanelScrolling();
            EnableRightPanelScrolling();
        }

        function DragVResize(e) {
            if (miDragBeginY == 0)
                return;

            var iDeltaY = e.pageY - miDragBeginY;

            var iNewSize = miDragBeginSize + iDeltaY;

            if (iNewSize < 100)
                iNewSize = 100;

            // video will block the panel from resizing, so hide it during the resize
            SetVideoVisibleForResize(false);

            $("#SplitViewLayout #LeftTopPanel").height(iNewSize);
            miTopPercent = iNewSize / $(window).height();
            StickyNotesFixHeight(iNewSize);
        }

        /*
            Identical to ChangeVideoPannelVisibility, except that it is only called during
            resize code. The JWPlayer doesn't like to be made invisible when it is starting up,
            so to minimize the chance of regression I made a new function.
        */
        function SetVideoVisibleForResize(isVisible) {
            $("#VideoPanelInner").css("display", isVisible ? "" : "none");
        }

        function StickyNotesFixHeight(iContainerHeight) {
            //text area won't resize vertically with css for some reason
            var oTextArea = $("#txtStickyNotes");
            oTextArea.css('resize', 'none');
            if (oTextArea.length > 0)
                oTextArea.height(iContainerHeight - 22);
        }

        function InitializeVideo(frame) {
            FixProportions();
        }

        function FixVideoSize(iContainerWidth, iContainerHeight) {
            if (iContainerWidth == 0)
                iContainerWidth = $("#VideoPanel").width();
            if (iContainerHeight == 0)
                iContainerHeight = $("#VideoPanel").height();

            var oVideo = $("#MediaPlayer1");
            if (oVideo.length == 0)
                return;

            $("#VideoPanelInner").width(iContainerWidth);
            $("#VideoPanelInner").height(iContainerHeight);

            oVideo.width(iContainerWidth - 0);
            oVideo.height(iContainerHeight - 0);
        }

        function FrameInsert(frame, func) {
            var sSrc = frame.attr("src");
            if (sSrc == undefined || sSrc.length == 0)
                return;

            //hack for media event, must insert frame height into the url
            sSrc = sSrc.replace("&Height=HHH", "&Height=" + ($(window).height() - 40));
            //if url begins with "url=", then insert a frame rather than try to parse the html
            if (sSrc.indexOf("url=") == 0) {
                frame.html("");
                frame.append("<iframe height='" + ($(window).height() - 40) + "' width='100%' frameborder='0' src='" + sSrc.substring(4) + "' allowfullscreen></iframe>");
                func(frame);
                return;
            }

            //grab the page
            AjaxGet(sSrc, function (data) {

                //if response is a url, open in new window
                if (data.substr(0, 4) == "http") {
                    frame.html("<a style='padding:16px;' href='" + data + "' target='_blank'>Download attachment</a>");
                    try {
                        window.top.open(data, "_blank");
                        // alert(window.top.location);
                    }
                    catch (exc) {
                        // alert(exc);
                    }
                    return;
                }

                var sHead = ExtractHtmlBlock(data, "head", 0)["Text"];

                ExtractStyleSheets(frame, sHead);
                ExtractScripts(frame, sHead);

                var sBody = ExtractHtmlBlock(data, "form", 0)["Text"];
                if (sBody == undefined || sBody.length == 0)
                    sBody = ExtractHtmlBlock(data, "body", 0)["Text"];

                if (sBody == undefined || sBody.length == 0)
                    sBody = data;
       
                frame.html("");
                frame.append($(sBody));

                RemoveViewStateControls(frame);

                func(frame);
            });
        }

        //Removes the viewstate input controls from the given html string
        function RemoveViewStateControls(frame)
        {
            var viewStateInput = frame.find("#__VIEWSTATE");
            if (viewStateInput.length > 0)
                viewStateInput.remove();
        }

        function ExtractStyleSheets(frame, sHead) {

            if (sHead == undefined || sHead.length == 0)
                return;

            var sStyleSheet;
            var iStartIndex = 0;

            while (true) {
                var nextTag = ExtractHtmlTag(sHead, "link", iStartIndex);

                sStyleSheet = nextTag["Text"];
                iStartIndex = nextTag["Start"];

                if (sStyleSheet == undefined)
                    return;

                var oStyle = $(sStyleSheet);
                var sStylesheetRef = oStyle.attr("href");
                if ($("link[type='text/css'][href='" + sStylesheetRef + "']").length == 0) {
                    //$("head").append($(sStyleSheet));
                    var oHead = document.getElementsByTagName("head")[0];
                    var oCssNode = document.createElement('link');
                    oCssNode.type = 'text/css';
                    oCssNode.rel = 'stylesheet';
                    oCssNode.href = sStylesheetRef;
                    oHead.appendChild(oCssNode);
                }
            }
        }

        function ExtractScripts(frame, sHead) {

            if (sHead == undefined || sHead.length == 0)
                return;

            var sScript;
            var iStartIndex = 0;

            while (true) {
                var nextScript = ExtractHtmlTag(sHead, "script", iStartIndex);

                sScript = nextScript["Text"];
                iStartIndex = nextScript["Start"];

                if (sScript == undefined)
                    return;

                var src = $(sScript).attr("src");
                if (src != undefined && $("script[src='" + src + "']").length == 0)
                    frame.append(sScript);
            }
        }

        function ExtractHtmlBlock(sHtml, sTag, iStartIndex) {
            var iNewStartIndex = sHtml.indexOf("<" + sTag, iStartIndex);
            if (iNewStartIndex <= iStartIndex)
                return new Object();

            iStartIndex = iNewStartIndex;

            while (sHtml.substr(iStartIndex, 1) != ">")
                iStartIndex++;

            iStartIndex++;

            var iEndIndex = sHtml.indexOf("</" + sTag, iStartIndex);

            var ret = new Object();
            ret["Start"] = iEndIndex;
            ret["Text"] = sHtml.substring(iStartIndex, iEndIndex);
            return ret;
        }

        function ExtractHtmlTag(sHtml, sTag, iStartIndex) {
            var iNewStartIndex = sHtml.indexOf("<" + sTag, iStartIndex);
            if (iNewStartIndex <= iStartIndex)
                return new Object();

            iStartIndex = iNewStartIndex;
            var iEndIndex = iStartIndex;
            while (sHtml.substr(iEndIndex, 1) != ">")
                iEndIndex++;
            iEndIndex++;

            var ret = new Object();
            ret["Start"] = iEndIndex;
            ret["Text"] = sHtml.substring(iStartIndex, iEndIndex);
            return ret;
        }

        function InitializeOutline(frame) {
            ReplaceLinks(frame);
            ReplaceLinks($("#divDownloadsMenu"));

            EnableLeftPanelScrolling();
            StickyNotesInitialize();

            // copied javascript
            $(".ShowMoreSpeakersButton").click(function () {
                var link = $(this);
                link.css("display", "none");
                var hidden = link.parent().find(".HiddenSpeakers");
                hidden.slideDown();
                return false;
            });

            $(".ShowFewerSpeakersButton").click(function () {
                var link = $(this);
                var hidden = link.parent().parent().find(".HiddenSpeakers");
                hidden.slideUp();

                var showMoreLink = link.parent().parent().find(".ShowMoreSpeakersButton");
                showMoreLink.css("display", "");
                return false;
            });
        }

        function ReplaceLinks(oContainer) {

            // replace any links that have the target "Detail" so that they display in the right panel
            oContainer.find("a[target='Detail']").each(function () {
                ReplaceLink($(this));
            });

            //replace any fileopen or fileview regardless of its target
            oContainer.find("a[href*='FileOpen']").each(function () {
                ReplaceLink($(this));
            });

            oContainer.find("a[href*='FileView']").each(function () {
                ReplaceLink($(this));
            });

            oContainer.find("a[href*='Detail']").each(function () {
                ReplaceLink($(this));
            });

            oContainer.find("a[href*='UserComment']").each(function () {
                ReplaceLink($(this));
            });

        }

        function ReplaceLink(oLink) {

            var url = oLink.attr("href");

            if (url.toLowerCase().indexOf("javascript:") >= 0)
                return;

            var detailFrame = $("#RightContent");

            oLink.attr("href", "#");

            oLink.attr("oldhref", url);

            StickyNotesAttachClickEvent(oLink);

            if (url.indexOf("UserComment.aspx") > -1)
                return;

            oLink.click(function () {

                detailFrame.html("Loading . . . ");
                $("#RightContent").css("padding-top", "");
                $("#RightContent").css("padding-left", "");
                $("#RightContent").css("padding-right", "");
                $("#RightContent").css("padding-bottom", "");

                var newUrl = url;

                // change fileopen to fileview
                if (newUrl.indexOf("FileOpen") != -1)
                    newUrl = newUrl.replace("FileOpen.aspx", "FileView.aspx") + "&Frame=SplitView&Height=" + ($("#divDetailScroller").height() + 20); //-75

                //ensure inline parameter is present
                if (newUrl.indexOf("FileView") != -1 && newUrl.indexOf("Inline") == -1 && newUrl.indexOf("inline") == -1) {
                    newUrl = Global_SetQueryParameter(newUrl, "Inline", "True");
                }

                // remove any Frame parameters that are not SplitView
                var sFrame = GetQueryParameters(newUrl)["Frame"];
                if (sFrame != null) {
                    if (sFrame.length > 0 && sFrame != "SplitView") {
                        newUrl = newUrl.replace("Frame=" + sFrame + "&", "");
                        newUrl = newUrl.replace("Frame=" + sFrame, "");
                    }
                }

                // ensure that Frame=Splitview is in the url
                if (newUrl.indexOf("Frame=SplitView") == -1)
                    newUrl += "&Frame=SplitView";

                //ignore javascript:void(0);
                
                lastUrl = detailFrame.attr("src");
                $('#btnGoBack').show();

                detailFrame.attr("src", newUrl);

                FrameInsert(detailFrame, function (e) {

                    ReplaceLinks(detailFrame);
                    if (moRightPanelScroller != undefined) {
                        moRightPanelScroller.scrollTo(0, 0);
                    }

                    //file view page has some special styling and logic
                    if (newUrl.indexOf("FileView") > -1) {
                        $("#RightContent").css("padding-top", "0");
                        $("#RightContent").css("padding-left", "0");
                        $("#RightContent").css("padding-right", "0");
                        $("#RightContent").css("padding-bottom", "0");
                        $("#btnDownloadDocument").css("display", "");
                    }
                    else {
                        $("#RightContent").css("padding-top", "");
                        $("#RightContent").css("padding-left", "");
                        $("#RightContent").css("padding-right", "");
                        $("#RightContent").css("padding-bottom", "");
                        $("#btnDownloadDocument").css("display", "none");
                    }

                });
                return false;
            });
        }

        function EnableLeftPanelScrolling() {
            var fResult = EnableScrolling("divOutlineScroller");
            InitializeVideo();
            return fResult;
        }

        function EnableRightPanelScrolling() {
            return EnableScrolling("divDetailScroller");
        }

        function EnableScrolling(panelId) {
            var scrollerDetails;
            var fUseTouchScroll = false;
            try {
                ResizeFrame(panelId);
                //only the ipad needs to use the TouchScroll
                if (navigator.userAgent.indexOf("iPad") > -1 || (navigator.userAgent.indexOf("Android") > -1)) {

                    var scrollNodeDetails = document.querySelector("#" + panelId);
                    scrollerDetails = new TouchScroll(scrollNodeDetails, { elastic: true });
                    fUseTouchScroll = true;
                }
            }
            catch (e) {
                fUseTouchScroll = false;
            }

            if (!fUseTouchScroll) {

                $("#" + panelId).css("overflow-y", "auto");
                scrollerDetails = undefined;
            }

            return scrollerDetails;

        }

        function ResizeFrame(panelId) {
            var iHeight = $(window).height() - $("#" + panelId).offset().top;
            $("#" + panelId).height(iHeight);
        }

        // special handler for refreshing the right panel when a comment is added
        function HandleSplitViewAddComment(sLink) {
            var detailFrame = $("#RightContent");
            detailFrame.html("");
            detailFrame.attr("src", sLink);

            FrameInsert(detailFrame, function (e) { if (moRightPanelScroller != undefined) { moRightPanelScroller.scrollTo(0, 0); } });
        }

        function lnkDownloads_Click() {
            var pos = $("#lnkDownloads").offset();

            $("#divDownloadsMenu").css("left", pos.left + "px");
            $("#divDownloadsMenu").css("top", $("#topBar").height() + 3);
            $("#divDownloadsMenu").slideToggle();
        }

        function lnkUpdateRequest_Click(iMeetingId) {
            // try to determine item based on the detail page
            var sDetailPageUrl = $("#RightContent").attr("src");
            var sParam = "";

            if (sDetailPageUrl.indexOf("Detail_LegiFile.aspx") >= 0)
                sParam = ExtractParameterForUpdateRequest(sDetailPageUrl, "ID", "ResolutionID");

            if (sDetailPageUrl.indexOf("Detail_Communication.aspx") >= 0)
                sParam = ExtractParameterForUpdateRequest(sDetailPageUrl, "ID", "CommunicationID");

            if (sDetailPageUrl.indexOf("Detail_Motion.aspx") >= 0)
                sParam = ExtractParameterForUpdateRequest(sDetailPageUrl, "ID", "MinutesItemID");

            if (sDetailPageUrl.indexOf("FileView.aspx?Type=4") >= 0)
                sParam = ExtractParameterForUpdateRequest(sDetailPageUrl, "ID", "AttachmentID");

            var sUrl = "/Agency/AgendaUpdateRequest.aspx?Frame=SplitView&MeetingID=" + iMeetingId + sParam;
            ShowInDetailPane(sUrl);

            return false;
        }

        function ExtractParameterForUpdateRequest(sUrl, sFind, sReplace) {
            var iStart = sUrl.indexOf("&" + sFind + "=");
            if (iStart < 0)
                iStart = sUrl.indexOf("?" + sFind + "=");

            if (iStart < 0)
                return "";

            var iEnd = sUrl.indexOf("&", iStart + 1);
            if (iEnd < 0)
                iEnd = sUrl.length;

            iStart += sFind.length + 1;

            return "&" + sReplace + sUrl.substring(iStart, iEnd);
        }

        function lnkMyNotes_Click(iMeetingId) {
            var sUrl = "/Citizens/Detail_Meeting.aspx?CssClass=AgendaOutline&Frame=SplitView&ID=" + iMeetingId + "&View=MyNotes";
            ShowInDetailPane(sUrl);
            return false;
        }

        function lnkDownloads_Click(iMeetingId) {
            var sUrl = "/Citizens/Detail_Meeting.aspx?CssClass=AgendaOutline&Frame=SplitView&ID=" + iMeetingId + "&View=Downloads";
            ShowInDetailPane(sUrl);
            return false;
        }

        function lnkResizeOutline_Click() {
            var sText = $("#lnkResizeOutline").html();
            var iLeftPct;
            var iRightPct;

            // toggles between Hide Outline > Show Outline
            if (sText.indexOf("Hide Outline") != -1) {
                sText = "Show Outline";
                iLeftPct = 1;
                iRightPct = 99;
                $("#LeftPanel").css("display", "none");
            }
            else {
                sText = "Hide Outline";
                iLeftPct = 35;
                iRightPct = 65;
                $("#LeftPanel").css("display", "");
            }

            $("#lnkResizeOutline").html(sText);
        }

        function DoSearch_Hook(sText) {
            ShowInDetailPane("/Citizens/Search.aspx?Frame=SplitView&SearchText=" + sText);
        }
        function GoBack() {
            var detailFrame = $("#RightContent");
            detailFrame.html("Loading . . . ");
            
            detailFrame.attr("src", lastUrl);
            if (lastUrl != '') {
                lastUrl = '';
                $('#btnGoBack').hide();
            }

            FrameInsert(detailFrame, function (e) {
                ReplaceLinks(detailFrame);
                if (moRightPanelScroller != undefined) {
                    moRightPanelScroller.scrollTo(0, 0);
                }
            });
        }
        function ShowInDetailPane(sUrl) {
            var detailFrame = $("#RightContent");
            detailFrame.html("Loading . . . ");
           
            lastUrl = detailFrame.attr("src");
            $('#btnGoBack').show();
            detailFrame.attr("src", sUrl);
            
            FrameInsert(detailFrame, function (e) {
                ReplaceLinks(detailFrame);
                if (moRightPanelScroller != undefined) {
                    moRightPanelScroller.scrollTo(0, 0);
                }
            });
        }

            $("#VideoPanelInner").attr("src", sUrl);
            FrameInsert($("#VideoPanelInner"));
        }*/

            var sLink = $("#RightContent a").attr("oldhref");
            window.open("/Citizens/" + sLink, "Download");
