services:
  - type: web
    name: rtr-deeplink
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers --forwarded-allow-ips='*' makes uvicorn trust Render's
    # X-Forwarded-For so request.client.host (and therefore per-IP rate
    # limiting on /api/resolve, see app/main.py) reflects the real caller
    # instead of Render's own edge-proxy IP. Render's proxy is trusted
    # infra here, not an arbitrary client that could spoof the header.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    # UNVERIFIED, check before relying on it: /api/transcription/check-
    # feasibility (app/main.py) now shells out to ffprobe (see
    # app/platforms/media_probe.py), a system binary this plain `runtime:
    # python` buildpack has never needed before and may not include. If a
    # deploy shows that endpoint failing (ffprobe: command not found in
    # logs), switch this service to `runtime: docker` -- worker/Dockerfile
    # is a working reference for the apt-get install ffmpeg step, just
    # swap its CMD for this service's uvicorn startCommand above.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_STATS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: ARCHIVE_BASE_URL
        sync: false
      - key: ARCHIVE_INGEST_TOKEN
        sync: false

  - type: web
    name: rtr-deeplink-archive
    runtime: python
    plan: free  # upgrade before /m/* links are publicly shared/indexed --
                # free services spin down after 15min idle (~30-60s cold
                # start), which is a real risk to crawl/index health here.
    buildCommand: pip install -r archive/requirements.txt
    startCommand: uvicorn archive.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: ARCHIVE_INGEST_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false

  # On-demand transcription's background processor (see worker/main.py's
  # module docstring for why this reaches into archive/db directly rather
  # than going through the token-gated /internal/* HTTP pattern the two
  # services above use with each other). No free tier for a Render
  # Background Worker -- real, ongoing cost, a deliberate tradeoff (see
  # BACKLOG_DONE.md) over a more complex free cron/poll-nudge design.
  - type: worker
    name: rtr-transcription-worker
    runtime: docker
    dockerfilePath: worker/Dockerfile
    dockerContext: .
    # UNVERIFIED, size before deploying: faster-whisper needs meaningfully
    # more CPU/RAM than Render's cheapest paid tier once a real model is
    # loaded -- confirm actual memory usage for the chosen model size
    # (worker/transcription_engine.py's model_size default) before
    # committing to a specific plan here.
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false  # MUST be the exact same value as rtr-deeplink-archive's DATABASE_URL above -- not a separate database
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
