services:
  - type: web
    name: rtr-deeplink
    runtime: python
    plan: free
    # `playwright install --with-deps chromium` is a real, unverified
    # deployment risk, not a routine addition -- see headless_browser.py's
    # own docstring and BACKLOG.md for the full context (Minneapolis
    # LIMS/SLC's Cloudflare-gated pages, confirmed live 2026-08-09 to need
    # a real headless Chromium fetch). ffprobe turned out to already be on
    # Render's plain python buildpack (see the comment below) -- that was
    # a pleasant surprise, not a guarantee this will be too. Chromium
    # needs real shared-library system dependencies (libnss3,
    # libatk-bridge2.0-0, libgtk-3-0, and more), a much bigger ask than
    # ffprobe's single binary -- `--with-deps` attempts to apt-get install
    # those automatically, which needs the build step to have the
    # necessary permissions in Render's build environment; genuinely
    # unconfirmed whether that works here, and `runtime: docker` (like
    # worker/'s own Dockerfile) may turn out to be required instead if it
    # doesn't. Needs a real Render deploy to actually verify -- do that
    # deliberately, expecting a real possible failure the way the
    # worker's own first two real deploys hit real OOM crashes (see
    # BACKLOG_DONE.md), not assuming this works on the first try.
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    # --proxy-headers --forwarded-allow-ips='*' makes uvicorn trust Render's
    # X-Forwarded-For so request.client.host (and therefore per-IP rate
    # limiting on /api/resolve, see app/main.py) reflects the real caller
    # instead of Render's own edge-proxy IP. Render's proxy is trusted
    # infra here, not an arbitrary client that could spoof the header.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    # ffprobe availability confirmed live 2026-08-08: a real POST to
    # /api/transcription/check-feasibility (app/main.py, shells out to
    # ffprobe via app/platforms/media_probe.py) against a live Granicus URL
    # returned {"ok": true, "duration_seconds": 27073.36, ...} -- Render's
    # plain `runtime: python` buildpack for this service already has
    # ffprobe on PATH, no Docker switch needed after all.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_STATS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: ARCHIVE_BASE_URL
        sync: false
      - key: ARCHIVE_INGEST_TOKEN
        sync: false

  - type: web
    name: rtr-deeplink-archive
    runtime: python
    plan: free  # upgrade before /m/* links are publicly shared/indexed --
                # free services spin down after 15min idle (~30-60s cold
                # start), which is a real risk to crawl/index health here.
    buildCommand: pip install -r archive/requirements.txt
    startCommand: uvicorn archive.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: ARCHIVE_INGEST_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false

  # On-demand transcription's background processor (see worker/main.py's
  # module docstring for why this reaches into archive/db directly rather
  # than going through the token-gated /internal/* HTTP pattern the two
  # services above use with each other). No free tier for a Render
  # Background Worker -- real, ongoing cost, a deliberate tradeoff (see
  # BACKLOG_DONE.md) over a more complex free cron/poll-nudge design.
  - type: worker
    name: rtr-transcription-worker
    runtime: docker
    dockerfilePath: worker/Dockerfile
    dockerContext: .
    # `starter` (512MB) OOM-crashed twice in real production, 2026-08-08 --
    # once loading the original "small" model default, and again (after
    # switching to "tiny") on a real 900s meeting chunk (~1421MB measured,
    # see BACKLOG.md's "Render worker plan sizing" entry for the full real
    # memory curve). `standard` (2GB) gives real, measured margin for that
    # same 900s/"tiny" combination -- not a guess this time.
    plan: standard
    envVars:
      - key: DATABASE_URL
        sync: false  # MUST be the exact same value as rtr-deeplink-archive's DATABASE_URL above -- not a separate database
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: HF_TOKEN
        sync: false  # optional -- unauthenticated Hugging Face Hub requests work fine today, just at a lower rate limit; see BACKLOG.md
