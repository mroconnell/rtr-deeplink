# This is a Render Blueprint -- Render treats it as the source of truth
# and reconciles every service (including its `plan:`) to match this file
# on every Blueprint sync, which fires automatically on every push to
# `main`. Confirmed live 2026-08-10: the user manually upgraded
# rtr-deeplink/rtr-deeplink-archive to a paid plan from Render's
# dashboard, and a later push silently reverted both back to `free` --
# not a Render bug, just this file being out of date with a decision made
# outside it. Keep every `plan:` below in sync with whatever's actually
# been decided (in chat or in Render's dashboard) -- a plan change made
# only in the dashboard WILL get silently undone by the next push.
# --- Deploys are manual (2026-08-25, WO-59) -------------------------------
#
# All four services carry `autoDeploy: false`. Merging to `main` no longer
# ships anything; a deploy is a separate, deliberate action.
#
# **Why.** Render bills *pipeline minutes*, and the workspace ran out on
# 2026-08-25, silently blocking every deploy -- the second time (see
# BACKLOG.md's pipeline-minutes entry; the first was 2026-08-19, ~5.5
# hours). Two rounds of buildFilter work had already cut build volume 31%
# then 24%, and it still ran out, because build volume scales with *merge
# count* and nothing capped that. On the day it happened, 21 commits
# landed on main in 24 hours.
#
# **The honest cost.** "Merge equals deploy" was a genuinely useful
# property, and losing it recreates the exact hazard the 2026-08-19
# incident was about: production quietly running older code than `main`.
# The difference is that it is now *deliberate and visible* rather than a
# surprise -- which is the whole bet. If that bet stops paying, the fix is
# to put `autoDeploy: true` back, not to work around it.
#
# **What this means for an agent working here:** merging is no longer the
# last step. See CLAUDE.md's "Deploys are manual" convention -- the short
# version is that you must tell the user when merged work is sitting
# undeployed, and ask for a deploy when it actually matters.
#
# **Migrations ride with the deploy, not the merge.** `preDeployCommand`
# (alembic upgrade head) runs when a deploy runs. A merged migration does
# nothing until then, which is safe -- code and schema still move
# together -- but it does mean "the migration landed" and "the migration
# ran" are now different events.
services:
  - type: web
    name: rtr-deeplink
    runtime: python
    # Deploys are MANUAL (2026-08-25, WO-59). `merge != deploy` here, on
    # purpose -- see the block comment above `services:` for the full
    # reasoning and for what an agent is expected to do about it.
    autoDeploy: false
    plan: standard
    # Build filter, reworked 2026-08-22 (WO-44) from a deny-list of docs
    # into an ALLOW-list of the paths this service actually ships.
    #
    # Why the inversion: the deny-list only suppressed a build when EVERY
    # changed path in a push matched ignoredPaths, so it caught doc-only
    # and queue-only pushes and nothing else. Measured against
    # origin/main over the 14 days to 2026-08-22 -- 441 pushes to `main`,
    # four services, 1,768 builds if nothing were filtered -- it removed
    # 557 (31%), NOT the ~85% an earlier version of BACKLOG.md's
    # pipeline-minutes entry claimed (that figure treated the queue-file
    # commits as the entire build volume; corrected in the same PR).
    # Meanwhile the deny-list kept growing: tests/, .github/, README.md,
    # CLAUDE.md and every new top-level *.md still triggered four builds
    # apiece, and each addition was a thing someone had to remember.
    # An allow-list inverts the default -- anything not named here does
    # not build this service, so a new doc, a new test tree or a new CI
    # workflow costs nothing without anyone having to maintain a list.
    #
    # Measured effect for this service: 295 -> 165 builds per fortnight.
    #
    # `ignoredPaths` survives only to carry `**/*.md`, which takes
    # precedence over `paths` (per Render's monorepo docs) -- that is
    # what stops app/**'s own markdown from rebuilding a service whose
    # behaviour it cannot change.
    #
    # shared_static/ is mounted by this service directly (app/main.py's
    # StaticFiles mount) and separately by the Archive, so it belongs in
    # both allow-lists. This service does NOT need archive/**: it reaches
    # the Archive over HTTP via _proxy_to_archive() (app/main.py), never
    # off disk.
    buildFilter:
      paths:
        - app/**
        - shared_static/**
        # Both web services render the partials in shared_templates/ (topic
        # chips + featured meeting cards, WO-50). These are allow-lists, so
        # omitting this would mean editing a shared partial deploys
        # nothing -- silently, since the push itself succeeds.
        - shared_templates/**
        - requirements.txt
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    # Real incident, 2026-08-09, two real failures in sequence, not one:
    # (1) the ORIGINAL `playwright install --with-deps chromium` build
    # step left a real user seeing `BrowserType.launch: Executable
    # doesn't exist...` in production -- the binary was never actually
    # installed. (2) The very next attempt at fixing that (this same
    # commit, unchanged) made the *build itself* fail outright ("Exited
    # with status 1 while building your code") -- strong evidence
    # `--with-deps` was the real culprit both times: it shells out to
    # `apt-get install` for Chromium's system libraries (libnss3,
    # libatk-bridge2.0-0, libgtk-3-0, ...), which needs root/sudo Render's
    # build sandbox almost certainly doesn't grant, so the whole chained
    # `&&` build command failed. Switched to plain `playwright install
    # chromium` (browser binary only, no system-package install attempt)
    # -- if Render's base image already has the needed shared libraries
    # (unconfirmed, but plausible: ffprobe turned out to already be
    # present too, see the comment below), this should be enough on its
    # own. `app/platforms/headless_browser.py`'s `_get_browser()` still
    # self-heals a missing-binary failure at runtime as a safety net, and
    # now also surfaces a clean (not raw-crash) error if Chromium's
    # binary exists but fails to *launch* due to a missing shared
    # library specifically -- that specific failure mode still isn't
    # actually fixed if it turns out to be the real one, just no longer
    # ugly. `runtime: docker` (like worker/'s own Dockerfile) is the real
    # fallback if a plain binary download isn't enough -- see BACKLOG.md.
    buildCommand: pip install -r requirements.txt && playwright install chromium
    # --proxy-headers --forwarded-allow-ips='*' makes uvicorn trust Render's
    # X-Forwarded-For so request.client.host (and therefore per-IP rate
    # limiting on /api/resolve, see app/main.py) reflects the real caller
    # instead of Render's own edge-proxy IP. Render's proxy is trusted
    # infra here, not an arbitrary client that could spoof the header.
    # Runs BEFORE the new build starts serving, same as the archive
    # service's -- schema lands ahead of the code that needs it, and a
    # failing migration cancels the deploy and leaves the old build up.
    #
    # ⚠️ THIS LINE IS ONLY SAFE ONCE THE ONE-TIME STAMP HAS BEEN DONE.
    # The resolver's Alembic history (app/alembic/, 2 revisions) had
    # never been stamped in production as of 2026-08-21. On an unstamped
    # database `alembic upgrade head` starts from the baseline revision,
    # whose CREATE TABLEs run against tables that already exist -- it
    # fails, and takes the deploy with it. The runbook is in
    # app/alembic/README.md ("The runbook"): read GET /admin/schema-info
    # first, then `cd app && alembic current` on THIS service's Render
    # shell, then stamp/upgrade per the table there. Stamp the literal
    # revision `a9207c0eb761`, never the word `head` -- head moves, and
    # an earlier version of this very comment said "stamp head" back
    # when the baseline was head, which would now mark production as
    # having jurisdiction_confidence whether or not it does (exactly the
    # 2026-08-09 archive incident, see archive/alembic/README.md).
    # `alembic current` must print `a9207c0eb761 (head)` before this
    # line is allowed to reach main.
    preDeployCommand: cd app && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    # ffprobe availability confirmed live 2026-08-08: a real POST to
    # /api/transcription/check-feasibility (app/main.py, shells out to
    # ffprobe via app/platforms/media_probe.py) against a live Granicus URL
    # returned {"ok": true, "duration_seconds": 27073.36, ...} -- Render's
    # plain `runtime: python` buildpack for this service already has
    # ffprobe on PATH, no Docker switch needed after all.
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Enables the generic fallback's headless-browser escalation
      # (app/platforms/generic_fallback.py -- one real-Chromium retry for
      # a blocked/challenge/empty-shell fetch). Flipped on 2026-08-14
      # only AFTER playwright-on-Render was finally verified working for
      # real: a fresh, never-archived Minneapolis LIMS meeting
      # (MarkedAgenda/COW/6144) resolved fully through production --
      # LIMS's resolve has no non-browser path, so that success is direct
      # proof the `playwright install chromium` build step above produces
      # a launchable browser, closing the "unconfirmed" question in the
      # build-step comment. A literal value, not sync:false -- this is a
      # feature flag, not a secret, and belongs in source control.
      - key: GENERIC_FALLBACK_HEADLESS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_STATS_TOKEN
        sync: false
      # New here 2026-08-10 -- the resolver never needed its own public
      # origin before (Archive/worker already had this for confirm-link/
      # canonical-tag building), but Clerk's authorized_parties check
      # needs to know the real public domain to reject a session token
      # replayed from a different origin. Same value as Archive's own
      # PUBLIC_BASE_URL: https://redtaperecordings.com.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      # New here 2026-08-11, alongside LIFECYCLE_EMAILS.md's "Thanks"/
      # "Welcome"/"Goodbye for now" emails -- this service previously only
      # ever upserted Resend audience contacts, never sent a transactional
      # email itself (that lived solely in archive/utils/email.py). Same
      # values as rtr-deeplink-archive's copies below.
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_REPLY_TO_ADDRESS
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: ARCHIVE_BASE_URL
        sync: false
      - key: ARCHIVE_INGEST_TOKEN
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      # Who GET /admin/daily-report (app/reporting.py) emails the once-a-day
      # operator digest to. Optional -- defaults to ryan@how-to-adu.com if
      # unset. Triggered by .github/workflows/daily-report.yml's cron
      # schedule rather than a Render Cron Job service, since those have no
      # free tier (confirmed, min $1/mo) and this reuses infra already
      # running/paid for here.
      - key: DAILY_REPORT_EMAIL_TO
        sync: false

  - type: web
    name: rtr-deeplink-archive
    runtime: python
    # Deploys are MANUAL (2026-08-25, WO-59). `merge != deploy` here, on
    # purpose -- see the block comment above `services:` for the full
    # reasoning and for what an agent is expected to do about it.
    autoDeploy: false
    plan: standard  # was starter (512MB) -- upgraded 2026-08-17 (see the
                   # top-of-file note on keeping this synced with real
                   # decisions) after `starter` OOM-crashed in production
                   # (Sentry: "Ran out of memory (used over 512MB)",
                   # 7:10-7:11 AM) on a /meetings?q=flock keyword search --
                   # see BACKLOG_DONE.md's "Search: move to a materialized/
                   # indexed column" entry for the root cause
                   # (list_pages() loading every TranscriptVersion.segments
                   # blob for every meeting into memory on any keyword
                   # search). `standard` buys headroom while that's fixed
                   # properly; it doesn't fix the underlying unbounded
                   # memory use. Originally was free -- upgraded to
                   # starter 2026-08-10. Free services spin down after
                   # 15min idle (~30-60s cold start), a real risk to
                   # crawl/index health for these public, potentially-
                   # indexed /m/* pages.
    # Allow-list -- see rtr-deeplink's block above for the full reasoning
    # (WO-44, 2026-08-22). Measured effect here: 326 -> 275 builds per
    # fortnight, well short of the resolver's 295 -> 165, and app/** is
    # why: this service is NOT self-contained. It imports
    # app.platforms.media_probe (main.py's binary_versions, and
    # utils/video_thumbnail.py) and app.utils.jurisdiction_enrich
    # (db/crud.py), so every resolver-side change rebuilds the Archive
    # too. That is real dependency, not waste -- do not "tidy" app/** out
    # of this list without re-checking those three imports first.
    #
    # scripts/tier3_auto_transcription_queue.txt no longer needs to be
    # listed here (removed 2026-08-30) -- this service used to be the
    # only one that read it at runtime (main.py's _TIER3_QUEUE_FILE /
    # _tier3_queue_remaining() line-counted it on disk for the ops
    # report), which meant a rebuild whenever the file changed or that
    # number silently froze at whatever the last real deploy shipped.
    # _tier3_queue_remaining() now reads a stored count from the database
    # instead (Tier3QueueState, updated by scripts/
    # feed_tier3_auto_transcription.py via POST /internal/
    # tier3-queue-remaining right after it rewrites the file) -- see that
    # model's own docstring. All four build-filter lists are back in
    # lockstep with no file-specific exception.
    buildFilter:
      paths:
        - archive/**
        - app/**
        - shared_static/**
        # See the resolver block above -- same shared partials, same
        # allow-list trap.
        - shared_templates/**
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    buildCommand: pip install -r archive/requirements.txt
    # WO-10 (AUDIT_EXECUTION_BRIEF.md, landed 2026-08-17): the schema
    # migration runs BEFORE the new build starts serving. Render runs
    # preDeployCommand after the build and before the instance is
    # switched live; if it fails, the deploy is cancelled and the previous
    # build keeps running -- exactly the ordering guarantee this repo was
    # missing (four incidents: 2026-08-09/10/13, and the 2026-08-17
    # UndefinedColumnError outage from a model column deploying ~13
    # minutes ahead of its ALTER TABLE, see BACKLOG_DONE.md). Idempotent:
    # "already at head" is a fast no-op, so it costs nothing on the
    # doc/CSS-only deploys that make up most pushes. Runs in this
    # service's own env (DATABASE_URL, the archive DB), from the repo
    # root, with alembic from archive/requirements.txt. Precondition
    # (verified before adding this): archive's alembic_version was at
    # head in prod (Ryan ran `alembic upgrade head` twice on 2026-08-17),
    # and `alembic check` against a fresh `upgrade head` DB reports no
    # missing model tables/columns -- CI now re-checks that on every PR.
    # archive/db/engine.py's create_all() is a no-op on Postgres since
    # the same change, so Alembic is the *only* thing that touches this
    # schema in production. The worker (below) shares this DB and does
    # NOT run migrations -- one owner, no concurrent-upgrade race.
    preDeployCommand: cd archive && alembic upgrade head
    startCommand: uvicorn archive.main:app --host 0.0.0.0 --port $PORT
    # This service started shelling out to ffmpeg on 2026-08-21 (WO-28,
    # meeting-card frame extraction) -- the first binary it has ever
    # needed. Its availability here is UNVERIFIED as of that change: the
    # confirmed-live ffprobe check in the rtr-deeplink block above was
    # against the *resolver*, and worker/Dockerfile installs ffmpeg
    # explicitly for the worker. The assumption is that this same
    # `runtime: python` buildpack ships it here too. GET /api/health now
    # reports a `media_tools` block with the real ffmpeg/ffprobe versions
    # (or null), so `curl $ARCHIVE_BASE_URL/api/health` settles it after
    # deploy -- deliberately informational, since Render gates deploys on
    # this endpoint and a service that can't make new thumbnails is still
    # healthy (pages just carry no og:image). See BACKLOG.md for the
    # fallback if it turns out to be absent.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      # WO-4 (AUDIT_EXECUTION_BRIEF.md, 2026-08-16): the real internal
      # Postgres hostname for rtr-deeplink-db (not a secret -- Render's
      # own internal service hostname, no credentials in it). Checked at
      # startup against DATABASE_URL's own host
      # (archive/db/engine.py's _assert_expected_db_host()) -- a real,
      # loud failure if DATABASE_URL ever gets pointed at the wrong
      # database instead of silent wrong-data confusion. A literal value,
      # not sync:false, so a Blueprint sync can't silently drop it the
      # way render.yaml's own header already warns a manually-set value
      # can be.
      - key: EXPECTED_DB_HOST
        value: dpg-d9r06nqjobas739hlc8g-a
      - key: ARCHIVE_INGEST_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # GA_MEASUREMENT_ID was live on the resolver but NOT declared here
      # for six days after archive/static/meeting_page.js started firing
      # events -- so every /m/* page shipped base.html's no-op
      # `window.trackEvent = function() {};` branch and silently discarded
      # video_play / transcript_seek / copy_link_to_time / save_meeting.
      # Confirmed live 2026-08-22 by reading a real page's HTML: no gtag
      # script, no G-* id. Set dashboard-side that day and verified end to
      # end (clicking the page's own share control fired
      # copy_link_to_time). Declared here so a service rebuilt from this
      # blueprint alone can't regress to the stub -- which would show up
      # as GA quietly returning to zero events, with nothing failing.
      # Same value as rtr-deeplink's copy above: one GA property, two
      # services.
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_REPLY_TO_ADDRESS
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      # HMAC key for the saved-search alert email's per-alert unsubscribe
      # link (archive/utils/link_tokens.py) -- deliberately its own
      # secret, not a reuse of CLERK_SECRET_KEY/ARCHIVE_INGEST_TOKEN
      # (both auth/service-boundary secrets for a different purpose).
      # Archive-only: verification happens where the link is clicked
      # (GET /alerts/unsubscribe), not on the resolver.
      - key: ALERT_UNSUBSCRIBE_SECRET
        sync: false
      # Social auto-posting (archive/utils/social.py) -- all optional; a
      # network with its pair unset is silently disabled, all unset means
      # the feature is inert. See archive/.env.example and README's
      # "Social auto-posting" section. Bluesky confirmed live-verified
      # 2026-08-21 (PR #267, a real prod resolve -> a real post) -- see
      # BACKLOG.md's social-residuals entry for what's still unconfirmed
      # (facet clickability, Mastodon has made zero real posts yet).
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: MASTODON_BASE_URL
        sync: false
      - key: MASTODON_ACCESS_TOKEN
        sync: false

  # On-demand transcription's background processor (see worker/main.py's
  # module docstring for why this reaches into archive/db directly rather
  # than going through the token-gated /internal/* HTTP pattern the two
  # services above use with each other). No free tier for a Render
  # Background Worker -- real, ongoing cost, a deliberate tradeoff (see
  # BACKLOG_DONE.md) over a more complex free cron/poll-nudge design.
  - type: worker
    name: rtr-transcription-worker
    runtime: docker
    # Deploys are MANUAL (2026-08-25, WO-59). `merge != deploy` here, on
    # purpose -- see the block comment above `services:` for the full
    # reasoning and for what an agent is expected to do about it.
    autoDeploy: false
    dockerfilePath: worker/Dockerfile
    dockerContext: .
    # Allow-list -- see rtr-deeplink's block above for the reasoning
    # (WO-44, 2026-08-22). Measured effect: 295 -> 243 builds per
    # fortnight, the smallest saving of the four services, deliberately.
    #
    # app/** and archive/** are here because worker/Dockerfile COPYs both
    # wholesale and worker/main.py imports app.platforms, app.utils.retry,
    # archive.db.crud and archive.utils.email directly. app/platforms/ and
    # archive/db/ are also the two most-churned trees in the repo, which
    # is exactly why this service rebuilds so often -- real dependency on
    # code that really changes, not waste.
    #
    # Scoping this to only the four subtrees worker/main.py imports would
    # reach ~200/fortnight, and was DECLINED 2026-08-22: it makes a build
    # trigger depend on an import graph, so the first `from app.utils.x
    # import y` added here without a matching render.yaml edit leaves both
    # workers silently running stale code. Read BACKLOG.md's
    # pipeline-minutes entry before revisiting that.
    #
    # This does NOT govern whether ffmpeg/faster-whisper reinstall on a
    # rebuild -- Render caches Docker layers by default and the Dockerfile
    # already orders both above its COPY lines, so a rebuild triggered by
    # app/** re-runs only the three cheap COPY layers.
    buildFilter:
      paths:
        - app/**
        - archive/**
        - worker/**
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    # `starter` (512MB) OOM-crashed twice in real production, 2026-08-08 --
    # once loading the original "small" model default, and again (after
    # switching to "tiny") on a real 900s meeting chunk (~1421MB measured,
    # see BACKLOG_DONE.md's "Render worker plan sizing" entry for the full
    # real memory curve). `standard` (2GB) gives real, measured margin for that
    # same 900s/"tiny" combination -- not a guess this time.
    plan: standard
    envVars:
      - key: DATABASE_URL
        sync: false  # MUST be the exact same value as rtr-deeplink-archive's DATABASE_URL above -- not a separate database
      # WO-4 (AUDIT_EXECUTION_BRIEF.md, 2026-08-16): same real, checked
      # guarantee for the "MUST be the exact same value" comment above --
      # see rtr-deeplink-archive's own matching entry for the full
      # reasoning.
      - key: EXPECTED_DB_HOST
        value: dpg-d9r06nqjobas739hlc8g-a
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_REPLY_TO_ADDRESS
        sync: false
      - key: HF_TOKEN
        sync: false  # optional -- unauthenticated Hugging Face Hub requests work fine today, just at a lower rate limit; see BACKLOG.md
      - key: AUTO_TRANSCRIPTION_REQUESTER_EMAIL
        sync: false  # optional -- idle-time auto-generation (worker/main.py) is silently disabled when unset; set to receive its completion-email activity digest

  # Second replica of the transcription worker above -- added 2026-08-21
  # to work down the ~1600+-meeting untranscribed backlog faster during a
  # bounded catch-up window (see BACKLOG.md's matching entry). A real,
  # distinct `type: worker` service, not `numInstances` on
  # rtr-transcription-worker -- Render's numInstances gives every replica
  # of one service block IDENTICAL env vars, and this one needs to differ
  # in exactly one: AUTO_TRANSCRIPTION_REQUESTER_EMAIL is deliberately
  # left UNSET below.
  #
  # Why that specific omission matters: claim_next_chunk()'s FOR UPDATE
  # SKIP LOCKED (archive/db/crud.py) already makes chunk-claiming safe for
  # any number of concurrent worker processes -- that's not what this
  # avoids. What it avoids is a SEPARATE, unguarded race in idle-time
  # auto-generation: maybe_generate_auto_job() -> find_auto_transcription_
  # candidate() (a plain, unlocked SELECT) -> create_transcription_job()
  # (its own separate, unlocked "does a job already exist for this page"
  # check-then-insert) -- two worker processes both idle at the same
  # moment (routine, once the queue drains) and both configured with a
  # real AUTO_TRANSCRIPTION_REQUESTER_EMAIL could both pass that check for
  # the same candidate page before either commits, creating two duplicate
  # low-priority jobs (real wasted compute, two completion emails -- see
  # BACKLOG.md). Leaving this var unset here means this replica's own
  # maybe_generate_auto_job() always short-circuits (worker/main.py, `if
  # not AUTO_TRANSCRIPTION_REQUESTER_EMAIL: return False`) and never
  # reaches create_transcription_job() at all -- the race is structurally
  # impossible on this pair, not just mitigated. It's still pure
  # chunk-processing capacity: claim_next_chunk()/report_chunk_result()
  # are unaffected and already safe (see rtr-transcription-worker's own
  # comment above, and claim_next_chunk()'s own docstring).
  #
  # Every other env var below MUST match rtr-transcription-worker's
  # corresponding value exactly (same DB, same outbound email identity,
  # same public base URL) -- set by hand in Render's dashboard for THIS
  # service too; sync: false vars are never copied between services by a
  # Blueprint sync. Meant to be temporary, for the backlog catch-up window
  # -- revisit (scale back down to one worker) once BACKLOG.md's ~1600+
  # figure is worked down; see that file's matching entry.
  - type: worker
    name: rtr-transcription-worker-2
    runtime: docker
    # Deploys are MANUAL (2026-08-25, WO-59). `merge != deploy` here, on
    # purpose -- see the block comment above `services:` for the full
    # reasoning and for what an agent is expected to do about it.
    autoDeploy: false
    dockerfilePath: worker/Dockerfile
    dockerContext: .
    # Allow-list, identical to rtr-transcription-worker's above and it
    # must stay identical -- these two blocks build the same image from
    # the same Dockerfile and the same context, so any path that rebuilds
    # one has to rebuild the other. See that block for the reasoning
    # (WO-44, 2026-08-22).
    buildFilter:
      paths:
        - app/**
        - archive/**
        - worker/**
        - render.yaml
      ignoredPaths:
        - "**/*.md"
    plan: standard
    envVars:
      - key: DATABASE_URL
        sync: false  # MUST be the exact same value as rtr-deeplink-archive's / rtr-transcription-worker's DATABASE_URL -- not a separate database
      - key: EXPECTED_DB_HOST
        value: dpg-d9r06nqjobas739hlc8g-a
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_AUDIENCE_ID
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_REPLY_TO_ADDRESS
        sync: false
      - key: HF_TOKEN
        sync: false  # optional -- see rtr-transcription-worker's matching comment
      # AUTO_TRANSCRIPTION_REQUESTER_EMAIL is deliberately NOT set here --
      # see the block comment above. Left out of the list entirely (not
      # present with an empty value) so this replica's idle-time
      # auto-generation path never activates.

databases:
  # WO-4 (AUDIT_EXECUTION_BRIEF.md, 2026-08-16): brings the one paid,
  # persistent-data resource into tracked config -- confirmed live via
  # Render's dashboard 2026-08-17 (then Basic-256mb, 256MB RAM/0.1 CPU/1GB
  # storage -- raised to basic-1gb later that day, see the plan comment
  # below; Oregon, PostgreSQL 18, hostname dpg-d9r06nqjobas739hlc8g-a --
  # matches EXPECTED_DB_HOST above). Render's Blueprint sync adopts an
  # existing database by exact `name:` match, the same mechanism already
  # proven safe for the three services above -- this is the first time
  # it's been tried for a database specifically in this repo, so this
  # change was reviewed with the user before merging, not treated as
  # routine (see AUDIT_EXECUTION_BRIEF.md's Wave 4 notes).
  #
  # Deliberately does NOT declare rtr-deeplink-staging-db here -- it's
  # free-tier and intentionally disposable (expires 9/9/2026, per the
  # Prerequisites table above). A future reader: that's not an oversight
  # to "fix," don't add it.
  #
  # plan: basic-1gb (was basic-256mb until 2026-08-17). Raised on real
  # evidence, not guesswork -- don't "optimize" it back down without
  # re-reading this. This one server hosts two logical databases:
  # rtr_archive (218MB -- every meeting page + transcript) and
  # rtr_deeplink_db (22MB, the resolver's). On the 256MB plan Postgres
  # had shared_buffers = 64MB, so the 77MB search corpus and 117MB of
  # transcript JSON could never stay cached: pg_stat_statements showed the
  # Archive's own /meetings keyword scans averaging 16.5s each (max 46s)
  # under real load vs 4.7s for the identical query run in isolation, and
  # cold TOAST reads at ~3MB/s -- pure I/O starvation, which no query
  # tuning fixed (#129/#131 tried). 1GB RAM => ~256MB shared_buffers plus
  # OS page cache, enough for the whole 218MB working set to stay
  # resident. Full detail: BACKLOG_DONE.md's "Search Step 1" entry and
  # BACKLOG.md's search entry (2026-08-17). Verify after the Blueprint
  # sync applies: `SHOW shared_buffers;` from the archive shell should
  # read ~256MB, not 64MB.
  - name: rtr-deeplink-db
    databaseName: rtr_deeplink_db
    plan: basic-1gb
    region: oregon
    postgresMajorVersion: "18"
