# Runs the pytest + node test suites on every push to main and every PR.
# Added 2026-08-14 (AUDIT_EXECUTION_BRIEF.md WO-2) -- previously nothing ran
# the suite between sessions, and a Render Blueprint sync auto-deploys
# `main` on every push, so a regression could reach production ungated.
#
# `push` is filtered to `main` on purpose: `pull_request` already covers
# every feature-branch push (a PR is open from first push in this repo's
# workflow), so an unfiltered `push` trigger ran the same suite twice per
# push -- confirmed 2026-08-14 verifying the branch ruleset, see
# BACKLOG_DONE.md. This also removes the ambiguity of two runs reporting
# under the same `test` status-check context.
#
# The suite is fully hermetic (tests/conftest.py pins a temp SQLite DB,
# HTTP is mocked, Playwright is monkeypatched) -- no network, Postgres, or
# `playwright install` step needed here. Python is pinned to 3.12.3 to
# match render.yaml's PYTHON_VERSION; local dev commonly runs 3.13.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched directly (not via push/pull_request) by
  # feed-tier3-transcription.yml / feed-granicus-transcription.yml's
  # queue-advancement step: PRs/branches created with the default
  # GITHUB_TOKEN don't trigger pull_request-triggered workflows (GitHub's
  # own loop-prevention for that token), so a queue-advance PR would
  # never get a "test" check on its own. workflow_dispatch is explicitly
  # exempt from that prevention, so those workflows dispatch this one
  # directly on the queue-advance branch; the resulting check run still
  # satisfies the branch ruleset's required "test" status check, since
  # required checks are matched by head SHA + job context ("test"), not
  # by which event produced the run. See those workflows' own comments.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # WO-12 (2026-08-16): ruff.toml has the (deliberately minimal) rule
      # selection and reasoning. Blocking -- the codebase is clean against
      # both as of this commit, which includes the one-time bulk reformat
      # (landed as its own commit, see that commit's own message, so it
      # doesn't poison git blame on the config-only change that added
      # `ruff check` a commit earlier).
      - run: ruff check app/ archive/ worker/ scripts/ tests/
      - run: ruff format --check app/ archive/ worker/ scripts/ tests/

      # WO-11 (2026-08-16): scan all three services' compiled lockfiles
      # for known vulnerabilities. Non-blocking on purpose for now --
      # `continue-on-error: true` -- so a newly-disclosed CVE doesn't
      # suddenly block every merge with no warning; flip this to blocking
      # once any initial noise from a real finding has been triaged.
      # pip-audit reads a requirements file's pins directly, no separate
      # install of archive/worker's own deps needed in this job's venv.
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
          pip-audit -r archive/requirements.txt
          pip-audit -r worker/requirements.txt

      # Plain `pytest` doesn't add the repo root to sys.path, so
      # `import app.main` / `import archive.main` fail with
      # ModuleNotFoundError (app/ and archive/ are top-level packages,
      # siblings of tests/, not underneath it) -- confirmed by this exact
      # failure on this workflow's first real run. `python -m pytest`
      # adds cwd to sys.path[0] the same way local dev invocations do.
      - run: python -m pytest

      # WO-10 (2026-08-17): the archive's models and its Alembic migrations
      # must agree, because production schema is now Alembic-only --
      # render.yaml's preDeployCommand runs `alembic upgrade head` before
      # each build goes live, and archive/db/engine.py's create_all() is a
      # no-op on Postgres. A model column added without a migration used
      # to be silently papered over by create_all(); now it would 500 in
      # prod. This catches it at PR time: build a fresh SQLite purely from
      # the migration chain, then `alembic check` diffs the models against
      # it and fails on any pending "add" operation. Blocking. (Runs on
      # SQLite deliberately: the Postgres-only objects the migrations add
      # -- pg_trgm index, the generated search_tsv column + its GIN index
      # -- are dialect-guarded in the migrations and unmapped on the
      # models, so both sides omit them here and the check is exact.
      # Verified clean 2026-08-17 before this step was added.)
      - name: alembic check (archive models == migrations)
        working-directory: archive
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_alembic_check.db
        run: |
          alembic upgrade head
          alembic check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm test
