# Feeds 12 Granicus pages every 6 hours into the worker's existing
# auto-transcription idle-time mechanism (worker/main.py's
# maybe_generate_auto_job(), see BACKLOG_DONE.md's 2026-08-09 entry) --
# no new transcription-job code, this just keeps real MeetingPage
# candidates (video present, no transcript) flowing into the pool that
# mechanism already pulls from.
#
# Runs on GitHub's own runners rather than a local launchd job (the
# pattern scripts/com.redtaperecordings.fetch-youtube-transcripts.plist
# uses) because Granicus, unlike YouTube, has no cloud-IP caption-fetch
# blocking -- there's no reason this needs to run from a residential IP,
# and a GitHub-hosted runner doesn't depend on Ryan's Mac being awake.
#
# Cadence (12 every 6h = 48/day) decided 2026-08-15 from the real
# Granicus median meeting length (144 min, 321 real archived meetings)
# and Whisper tiny's ~6x realtime speed -- see SOURCING_QUEUE.md's
# "Cadence decided" note (rtr-business/research/) for the full math.
#
# The queue (scripts/granicus_auto_transcription_queue.txt) is the 481
# Granicus "agenda-only" pages confirmed live 2026-08-15 to actually have
# real video -- see rtr-business/research/session_report_2026-08-15.md.
# scripts/feed_granicus_auto_transcription.py pops 12 off the front each
# run and rewrites the file; this workflow commits that change back so
# state persists across runs. At 12/run the queue lasts ~40 runs (~10
# days) before it's naturally exhausted, at which point this workflow
# becomes a silent no-op (the script exits cleanly on an empty queue).
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions),
# separate from the ADMIN_STATS_TOKEN/RESOLVER_BASE_URL pair
# daily-report.yml uses:
#   ARCHIVE_BASE_URL     -- the Archive service's own base URL
#   ARCHIVE_INGEST_TOKEN -- matching whatever's set on that Render service
name: Feed Granicus auto-transcription queue

on:
  schedule:
    # Every 6 hours, off the top of the hour per GitHub's own guidance on
    # avoiding the exact-hour pile-up every other repo's cron jobs land on.
    - cron: "13 */6 * * *"
  workflow_dispatch: {}

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.QUEUE_ADVANCE_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feed the next batch
        env:
          ARCHIVE_BASE_URL: ${{ secrets.ARCHIVE_BASE_URL }}
          ARCHIVE_INGEST_TOKEN: ${{ secrets.ARCHIVE_INGEST_TOKEN }}
        run: python scripts/feed_granicus_auto_transcription.py

      # Was a direct `git push` to main -- broken since the 2026-08-14
      # branch ruleset (requires a PR + passing "test" check, blocks
      # direct pushes; see BACKLOG_DONE.md). Every run's push was being
      # silently rejected (GH013), so the queue never actually advanced.
      # Fixed by routing through a PR instead. `allow_auto_merge` is off
      # for this repo (confirmed via `gh api repos/.../rtr-deeplink`), so
      # rather than flip that repo setting, this waits for the "test"
      # check itself and merges directly once it's green.
      #
      # Auth here is QUEUE_ADVANCE_PAT (a fine-grained PAT scoped to this
      # repo only, Contents + Pull requests read/write, expires
      # 2026-10-17 -- see BACKLOG_DONE.md), not the default GITHUB_TOKEN.
      # Reason: a GITHUB_TOKEN-authored PR's author_association comes back
      # "CONTRIBUTOR" on this public repo, so its real pull_request-
      # triggered test.yml run sits stuck in action_required pending
      # manual approval, and the main ruleset's required "test" check only
      # ever credits that genuine pull_request-triggered run -- not a
      # workflow_dispatch stand-in (confirmed live, 2026-08-18: two
      # passing, correctly PR-linked workflow_dispatch test check-runs
      # were still rejected with "the base branch policy prohibits the
      # merge" until a human manually approved the stuck run). A PAT-
      # authored PR should carry author_association OWNER instead and
      # never hit that gate -- the workflow_dispatch dispatch-and-poll
      # below (added in PR #144, run-selection-fixed in PR #172) is kept
      # for now as a fallback until that's confirmed live for both
      # workflows; remove it only after real evidence the natural
      # pull_request-triggered run gets credited without it.
      - name: Advance queue via PR
        env:
          GH_TOKEN: ${{ secrets.QUEUE_ADVANCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/granicus_auto_transcription_queue.txt
          if git diff --cached --quiet; then
            echo "No queue change to commit."
            exit 0
          fi

          BRANCH="queue-advance/granicus-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Advance Granicus auto-transcription queue"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Advance Granicus auto-transcription queue" \
            --body "Automated queue advancement from the Granicus feed workflow (run ${{ github.run_id }}). Per-URL outcomes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main \
            --head "$BRANCH")
          echo "Opened $PR_URL"

          # See the comment above this step: with QUEUE_ADVANCE_PAT this
          # PR should be author_association OWNER, so its natural
          # pull_request-triggered test.yml run should fire without
          # hitting the approval gate. This still dispatches a
          # workflow_dispatch run as a fallback and filters strictly to
          # it (see PR #172) rather than assuming the natural run landed,
          # since that hasn't been proven unattended yet.
          gh workflow run test.yml --ref "$BRANCH"

          echo "Waiting for the dispatched test.yml run to appear..."
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow=test.yml --branch="$BRANCH" --event=workflow_dispatch --limit=1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Dispatched test.yml run never appeared -- leaving PR $PR_URL open for manual review." >&2
            exit 1
          fi

          echo "Watching run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status

          gh pr merge "$BRANCH" --squash --delete-branch
