# Feeds 12 "tier 3" pages every 6 hours into the worker's existing
# auto-transcription idle-time mechanism (worker/main.py's
# maybe_generate_auto_job(), see BACKLOG_DONE.md's 2026-08-09 entry) --
# same pattern as feed-granicus-transcription.yml, for a different
# platform mix (escribe/iqm2/civicclerk/etc pages found 2026-08-16 to
# have a real video but no captions and no agenda -- see
# scripts/feed_tier3_auto_transcription.py's own docstring for why this
# needed a separate script rather than reusing feed_granicus_
# auto_transcription.py's bulk_ingest.py call directly).
#
# Runs on GitHub's own runners for the same reason feed-granicus-
# transcription.yml does -- none of these platforms have YouTube's
# cloud-IP caption-fetch blocking, so there's no residential-IP
# requirement here.
#
# The queue (scripts/tier3_auto_transcription_queue.txt) is 466 pages
# confirmed live 2026-08-16 to have a real video_url via a direct
# re-resolve (not just an archived-URL match) -- see
# rtr-business/research/video_hosting_catalog_combined.csv for the full
# per-URL data this queue was built from.
#
# Batch size (12/6h) reuses feed-granicus-transcription.yml's cadence as
# a starting default, not independently derived from this queue's real
# median video length -- see feed_tier3_auto_transcription.py's own
# docstring. Cron minute (:43) deliberately offset from the Granicus
# job's :13 so the two scheduled jobs don't land in the same minute
# (same reasoning as daily-report.yml / send-search-alerts.yml's offset).
#
# Requires the same two repo secrets feed-granicus-transcription.yml
# already uses (Settings -> Secrets and variables -> Actions):
#   ARCHIVE_BASE_URL     -- the Archive service's own base URL
#   ARCHIVE_INGEST_TOKEN -- matching whatever's set on that Render service
name: Feed tier 3 auto-transcription queue

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch: {}

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.QUEUE_ADVANCE_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feed the next batch
        env:
          ARCHIVE_BASE_URL: ${{ secrets.ARCHIVE_BASE_URL }}
          ARCHIVE_INGEST_TOKEN: ${{ secrets.ARCHIVE_INGEST_TOKEN }}
        run: python scripts/feed_tier3_auto_transcription.py

      # Was a direct `git push` to main -- broken since the 2026-08-14
      # branch ruleset (requires a PR + passing "test" check, blocks
      # direct pushes; see BACKLOG_DONE.md). Fixed by routing through a
      # PR instead. `allow_auto_merge` is off for this repo (confirmed
      # via `gh api repos/.../rtr-deeplink`), so rather than flip that
      # repo setting, this waits for the "test" check itself and merges
      # directly once it's green.
      #
      # Auth here is QUEUE_ADVANCE_PAT (a fine-grained PAT scoped to this
      # repo only, Contents + Pull requests read/write, expires
      # 2026-10-17 -- see BACKLOG_DONE.md), not the default GITHUB_TOKEN.
      # Reason: a GITHUB_TOKEN-authored PR's author_association comes back
      # "CONTRIBUTOR" on this public repo, so its real pull_request-
      # triggered test.yml run sits stuck in action_required pending
      # manual approval, and the main ruleset's required "test" check only
      # ever credits that genuine pull_request-triggered run -- not a
      # workflow_dispatch stand-in (confirmed live, 2026-08-18: two
      # passing, correctly PR-linked workflow_dispatch test check-runs
      # were still rejected with "the base branch policy prohibits the
      # merge" until a human manually approved the stuck run). A PAT-
      # authored PR should carry author_association OWNER instead and
      # never hit that gate -- the workflow_dispatch dispatch-and-poll
      # below (added in PR #144, run-selection-fixed in PR #172) is kept
      # for now as a fallback until that's confirmed live for both
      # workflows; remove it only after real evidence the natural
      # pull_request-triggered run gets credited without it.
      - name: Advance queue via PR
        env:
          GH_TOKEN: ${{ secrets.QUEUE_ADVANCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/tier3_auto_transcription_queue.txt
          if git diff --cached --quiet; then
            echo "No queue change to commit."
            exit 0
          fi

          BRANCH="queue-advance/tier3-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Advance tier 3 auto-transcription queue"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Advance tier 3 auto-transcription queue" \
            --body "Automated queue advancement from the tier-3 feed workflow (run ${{ github.run_id }}). Per-URL outcomes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main \
            --head "$BRANCH")
          echo "Opened $PR_URL"

          # See the comment above this step: with QUEUE_ADVANCE_PAT this
          # PR should be author_association OWNER, so its natural
          # pull_request-triggered test.yml run should fire without
          # hitting the approval gate. This still dispatches a
          # workflow_dispatch run as a fallback and filters strictly to
          # it (see PR #172) rather than assuming the natural run landed,
          # since that hasn't been proven unattended yet.
          gh workflow run test.yml --ref "$BRANCH"

          echo "Waiting for the dispatched test.yml run to appear..."
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow=test.yml --branch="$BRANCH" --event=workflow_dispatch --limit=1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Dispatched test.yml run never appeared -- leaving PR $PR_URL open for manual review." >&2
            exit 1
          fi

          echo "Watching run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status

          gh pr merge "$BRANCH" --squash --delete-branch
