# Feeds 12 "tier 3" pages every 6 hours into the worker's existing
# auto-transcription idle-time mechanism (worker/main.py's
# maybe_generate_auto_job(), see BACKLOG_DONE.md's 2026-08-09 entry) --
# same pattern as feed-granicus-transcription.yml, for a different
# platform mix (escribe/iqm2/civicclerk/etc pages found 2026-08-16 to
# have a real video but no captions and no agenda -- see
# scripts/feed_tier3_auto_transcription.py's own docstring for why this
# needed a separate script rather than reusing feed_granicus_
# auto_transcription.py's bulk_ingest.py call directly).
#
# Runs on GitHub's own runners for the same reason feed-granicus-
# transcription.yml does -- none of these platforms have YouTube's
# cloud-IP caption-fetch blocking, so there's no residential-IP
# requirement here.
#
# The queue (scripts/tier3_auto_transcription_queue.txt) is 466 pages
# confirmed live 2026-08-16 to have a real video_url via a direct
# re-resolve (not just an archived-URL match) -- see
# rtr-business/research/video_hosting_catalog_combined.csv for the full
# per-URL data this queue was built from.
#
# Batch size (12/6h) reuses feed-granicus-transcription.yml's cadence as
# a starting default, not independently derived from this queue's real
# median video length -- see feed_tier3_auto_transcription.py's own
# docstring. Cron minute (:43) deliberately offset from the Granicus
# job's :13 so the two scheduled jobs don't land in the same minute
# (same reasoning as daily-report.yml / send-search-alerts.yml's offset).
#
# Requires the same two repo secrets feed-granicus-transcription.yml
# already uses (Settings -> Secrets and variables -> Actions):
#   ARCHIVE_BASE_URL     -- the Archive service's own base URL
#   ARCHIVE_INGEST_TOKEN -- matching whatever's set on that Render service
name: Feed tier 3 auto-transcription queue

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch: {}

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Feed the next batch
        env:
          ARCHIVE_BASE_URL: ${{ secrets.ARCHIVE_BASE_URL }}
          ARCHIVE_INGEST_TOKEN: ${{ secrets.ARCHIVE_INGEST_TOKEN }}
        run: python scripts/feed_tier3_auto_transcription.py

      # Was a direct `git push` to main -- broken since the 2026-08-14
      # branch ruleset (requires a PR + passing "test" check, blocks
      # direct pushes; see BACKLOG_DONE.md). Every run's push was being
      # silently rejected (GH013), so the queue never actually advanced.
      # Fixed by routing through a PR instead. `allow_auto_merge` is off
      # for this repo (confirmed via `gh api repos/.../rtr-deeplink`), so
      # rather than flip that repo setting, this waits for the "test"
      # check itself (dispatched manually -- see test.yml's
      # workflow_dispatch comment for why that's necessary) and merges
      # directly once it's green.
      - name: Advance queue via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/tier3_auto_transcription_queue.txt
          if git diff --cached --quiet; then
            echo "No queue change to commit."
            exit 0
          fi

          BRANCH="queue-advance/tier3-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Advance tier 3 auto-transcription queue"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Advance tier 3 auto-transcription queue" \
            --body "Automated queue advancement from the tier-3 feed workflow (run ${{ github.run_id }}). Per-URL outcomes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main \
            --head "$BRANCH")
          echo "Opened $PR_URL"

          # PRs/branches created with GITHUB_TOKEN don't trigger
          # pull_request-triggered workflows, so the required "test"
          # check would never appear on this PR by itself.
          # workflow_dispatch is exempt from that restriction.
          gh workflow run test.yml --ref "$BRANCH"

          echo "Waiting for the dispatched test.yml run to appear..."
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow=test.yml --branch="$BRANCH" --limit=1 --json databaseId --jq '.[0].databaseId' || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "Dispatched test.yml run never appeared -- leaving PR $PR_URL open for manual review." >&2
            exit 1
          fi

          echo "Watching run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status

          gh pr merge "$BRANCH" --squash --delete-branch
