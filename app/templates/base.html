<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">{% block title %}Red Tape Recordings{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {% if GA_MEASUREMENT_ID %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ GA_MEASUREMENT_ID }}');
    window.trackEvent = function(name, params) { gtag('event', name, params || {}); };
  </script>
  {% else %}
  <script>window.trackEvent = function() {};</script>
  {% endif %}
  {% block head_extra %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="/">
        <span class="navbar-cassette-icon" aria-hidden="true">
          <svg width="32" height="14" viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="116" height="36" rx="6" fill="#222" stroke="#c4b998" stroke-width="3"/>
            <rect x="14" y="14" width="92" height="20" rx="2" fill="#e6e0c4" stroke="#b7a77a" stroke-width="2"/>
            <rect x="38" y="20" width="44" height="8" rx="1" fill="#c4b998"/>
            <circle cx="32" cy="24" r="6" fill="#fff" stroke="#bbb" stroke-width="2"/>
            <circle cx="32" cy="24" r="2" fill="#bbb"/>
            <circle cx="88" cy="24" r="6" fill="#fff" stroke="#bbb" stroke-width="2"/>
            <circle cx="88" cy="24" r="2" fill="#bbb"/>
          </svg>
        </span>
        <span class="dymo-label">Red Tape Recordings</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/">Look Up a Meeting</a>
          </li>
          <li class="nav-divider d-none d-lg-block" aria-hidden="true"></li>
          <li class="nav-item">
            <a class="nav-link" href="/about">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <div class="container-fluid">
      <form id="newsletterForm" class="newsletter-form">
        <label for="newsletterEmail" class="newsletter-label">Get notified about new features and tools for finding public meetings</label>
        <div class="input-group newsletter-input-group">
          <input type="email" id="newsletterEmail" class="form-control" placeholder="you@example.com" required>
          <button type="submit" class="btn btn-primary">Sign up</button>
        </div>
        <p id="newsletterMessage" class="newsletter-message" hidden></p>
      </form>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/newsletter.js"></script>
</body>
</html>
