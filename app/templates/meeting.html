<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Meeting | rtr-deeplink</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
</head>
<body data-source-url="{{ source_url }}">
  <main class="meeting-page">
    <a href="/" class="back-link">&larr; New URL</a>
    <div id="meta" class="meta"></div>

    <div id="statusMessage" class="status"></div>

    <div id="videoSection" class="video-section" hidden>
      <div class="toolbar">
        <button id="linkToCurrentBtn" title="Copy link to current time">Copy link to current time</button>
        <button id="toggleAutoScrollBtn" title="Toggle auto-scroll">Auto-scroll: <span id="autoScrollState">On</span></button>
        <form id="seekForm" class="seek-form">
          <input id="seekInput" type="text" inputmode="numeric" placeholder="1:23:45" aria-label="Jump to timestamp">
          <button type="submit">Go to time</button>
        </form>
      </div>
      <div id="videoWrapper" class="video-wrapper">
        <video id="meetingVideo" controls playsinline preload="auto"></video>
        <button id="bigPlayButton" class="big-play-button" aria-label="Play video" hidden>
          <svg viewBox="0 0 68 68" width="68" height="68" aria-hidden="true"><circle cx="34" cy="34" r="34" fill="rgba(0,0,0,0.55)"/><path d="M27 20 L48 34 L27 48 Z" fill="#fff"/></svg>
        </button>
      </div>
      <div id="videoError" class="error" hidden></div>
    </div>

    <div id="transcriptSection" class="transcript-section" hidden>
      <h2>Transcript</h2>
      <div id="transcriptWarnings" class="warnings"></div>
      <div id="transcriptSearch" class="transcript-search">
        <input id="transcriptSearchInput" type="text" placeholder="Search transcript&hellip;" aria-label="Search transcript">
        <span id="transcriptSearchCount" class="transcript-search-count"></span>
        <button id="transcriptSearchPrev" type="button" title="Previous match" aria-label="Previous match">&#9650;</button>
        <button id="transcriptSearchNext" type="button" title="Next match" aria-label="Next match">&#9660;</button>
      </div>
      <div id="transcriptList" class="transcript-list"></div>
    </div>
    <div id="transcriptMissing" class="transcript-section" hidden>
      <h2>Transcript</h2>
      <div id="transcriptMissingWarnings" class="warnings"></div>
    </div>
  </main>
  <script src="/static/player.js"></script>
</body>
</html>
